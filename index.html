<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 32px;
    }
    #list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .page-link {
      display: block;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px 20px;
      text-decoration: none;
      color: #111;
      font-size: 0.95rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .page-link:hover {
      border-color: #666;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .page-link .name {
      font-weight: 500;
    }
    .page-link .path {
      font-size: 0.78rem;
      color: #aaa;
      margin-top: 3px;
    }
    .empty {
      color: #aaa;
      font-size: 0.9rem;
      padding: 20px 0;
    }
    .error {
      color: #c0392b;
      font-size: 0.85rem;
      background: #fdf0ee;
      border: 1px solid #f5c6c0;
      border-radius: 6px;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pages</h1>
    <p class="subtitle">All available pages</p>
    <div id="list">Loading...</div>
  </div>

  <script>
    const OWNER = 'maheswaranb-blip';
    const REPO = 'pages';
    const FOLDER = 'docs';
    const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;
    const BASE = `https://${OWNER}.github.io/${REPO}/${FOLDER}/`;

    async function load() {
      const el = document.getElementById('list');
      try {
        const res = await fetch(API);
        if (res.status === 404) {
          el.innerHTML = '<p class="empty">No pages yet. Add .html files to the /docs folder.</p>';
          return;
        }
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const files = await res.json();
        const pages = files.filter(f => f.name.endsWith('.html'));
        if (pages.length === 0) {
          el.innerHTML = '<p class="empty">No pages yet. Add .html files to the /docs folder.</p>';
          return;
        }
        el.innerHTML = pages.map(f => {
          const label = f.name.replace('.html', '').replace(/[-_]/g, ' ');
          const capitalized = label.charAt(0).toUpperCase() + label.slice(1);
          return `<a class="page-link" href="${BASE}${f.name}">
            <div class="name">${capitalized}</div>
            <div class="path">/docs/${f.name}</div>
          </a>`;
        }).join('');
      } catch (e) {
        el.innerHTML = `<p class="error">Could not load pages: ${e.message}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
